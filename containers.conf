[containers]
# Default container runtime
netns = "host"
userns = "host"
ipcns = "host"
utsns = "host"
cgroupns = "host"
cgroups = "disabled"
log_driver = "k8s-file"

# Environment for nested podman
env = [
    "BUILDAH_ISOLATION=chroot",
    "STORAGE_DRIVER=overlay"
]

[engine]
# Use crun for better rootless support
runtime = "crun"

# Events logger
events_logger = "file"

[network]
# Use pasta for rootless networking (default in Podman 5+)
default_network = "pasta"
