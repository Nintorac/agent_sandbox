[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options]
# Use fuse-overlayfs for nested container support
mount_program = "/usr/bin/fuse-overlayfs"

[storage.options.overlay]
# Force use of fuse-overlayfs
force_mask = "shared"
mount_program = "/usr/bin/fuse-overlayfs"
