[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options]
# Native overlay (kernel 5.13+) - no fuse-overlayfs needed
# mount_program = "/usr/bin/fuse-overlayfs"

[storage.options.overlay]
# Native overlay uses kernel support, not userspace fuse
force_mask = "shared"
# mount_program = "/usr/bin/fuse-overlayfs"
